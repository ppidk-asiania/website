version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev # bot PRs enter through dev like any other change
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Majors are deliberate upgrades (docs/development.md), not bot PRs:
    # @types/node tracks the Node LTS we run (24); TypeScript/ESLint majors break typescript-eslint.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        {
          patterns:
            ["next", "react", "react-dom", "@types/react*", "@next/*", "eslint-config-next"],
        }
      lint-format:
        { patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier", "globals"] }
      test: { patterns: ["vitest", "@vitest/*", "@playwright/test"] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
